<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>غير متصل بالإنترنت | أكاديمية المهندس الزراعي</title>
    <meta name="theme-color" content="#0b0f12">
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
    <link rel="stylesheet" href="style.css">
    <style>
        /* أنماط مدمجة لضمان عمل الصفحة حتى في أسوأ حالات انقطاع الشبكة */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', 'Cairo', sans-serif;
            background-color: #0b0f12;
            color: #e6edf3;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        .offline-container {
            max-width: 400px;
            padding: 2rem;
            background: rgba(21, 26, 32, 0.8);
            border: 1px solid #2a3038;
            border-radius: 18px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
        }
        .offline-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 1.5rem;
            background: rgba(231, 76, 60, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e74c3c;
            font-size: 2.5rem;
        }
        .academy-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.4rem 1rem;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 50px;
            margin-bottom: 1.5rem;
            font-size: 0.85rem;
            font-weight: 700;
            color: #2ecc71;
        }
        h1 {
            font-family: 'Cairo', sans-serif;
            font-size: 1.5rem;
            font-weight: 800;
            margin: 0 0 1rem 0;
            color: #fff;
        }
        p {
            font-size: 0.95rem;
            line-height: 1.7;
            color: #9ba9b6;
            margin-bottom: 2rem;
        }
        .offline-actions {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.8rem 1.5rem;
            border-radius: 50px;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            min-height: 44px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            color: #000;
            box-shadow: 0 4px 15px rgba(39, 174, 96, 0.3);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(39, 174, 96, 0.4);
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: #e6edf3;
            border: 1px solid #2a3038;
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #3498db;
            color: #3498db;
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="academy-badge">
            <span>🎓</span>
            <span>أكاديمية المهندس الزراعي</span>
        </div>
        
        <div class="offline-icon">
            <!-- أيقونة WiFi مقطوعة (SVG مدمج لضمان الظهور دائماً) -->
            <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="1" y1="1" x2="23" y2="23"></line>
                <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
                <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
                <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
                <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
                <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
                <line x1="12" y1="20" x2="12.01" y2="20"></line>
            </svg>
        </div>

        <h1>غير متصل بالإنترنت</h1>
        <p>
            يبدو أن اتصالك بالشبكة غير متاح حالياً. 
            <br>
            يعمل التطبيق بشكل أفضل مع الاتصال بالإنترنت، لكن يمكنك العودة للأقسام التي تم تحميلها مسبقاً أو المحاولة مرة أخرى.
        </p>

        <div class="offline-actions">
            <button class="btn btn-primary" onclick="window.location.reload()">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.3"/></svg>
                إعادة المحاولة
            </button>
            <a href="/" class="btn btn-secondary">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                العودة للرئيسية
            </a>
        </div>
    </div>
</body>
</html>
