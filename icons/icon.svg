<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    <!-- خلفية متدرجة -->
    <defs>
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#0b0f12"/>
            <stop offset="100%" style="stop-color:#1c2128"/>
        </linearGradient>
    </defs>
    
    <!-- خلفية مربعة -->
    <rect width="512" height="512" fill="url(#bg)"/>
    
    <!-- أيقونة الفراشة -->
    <text x="50%" y="55%" dominant-baseline="middle" text-anchor="middle" 
          font-size="280" font-family="Arial">🦋</text>
    
    <!-- نص TUTA -->
    <text x="50%" y="82%" dominant-baseline="middle" text-anchor="middle" 
          font-size="50" fill="#e74c3c" font-family="Arial" font-weight="bold">TUTA</text>
</svg>